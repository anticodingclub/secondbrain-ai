[project]
name = "secondbrain-backend"
version = "0.1.0"
description = "SecondBrain AI - local-first personal search engine backend"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "structlog>=24.4.0",
    "qdrant-client>=1.12.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "email-validator>=2.2.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
embeddings-fast = ["fastembed>=0.4.0"]
embeddings-torch = ["sentence-transformers>=3.3.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# TC (type-checking-block) rules are deliberately excluded: FastAPI and Pydantic
# resolve annotations at runtime, so moving those imports breaks DI.
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that touch the database or external services",
    "slow: tests that download or run a real embedding model",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*"]
